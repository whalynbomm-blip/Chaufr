name: Android app builds

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "apps/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build passenger and driver debug APKs
        run: gradle :apps:passenger-android:assembleDebug :apps:driver-android:assembleDebug
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: chaufr-android-debug-apks
          path: |
            apps/passenger-android/build/outputs/apk/debug/*.apk
            apps/driver-android/build/outputs/apk/debug/*.apk
