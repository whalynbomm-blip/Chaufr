name: Android app builds

on:
  push:
    branches: [main, feature/payments-payouts-verification]
    paths:
      - "apps/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "apps/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build passenger and driver debug APKs
        env:
          ORG_GRADLE_PROJECT_chaufrGoogleMapsApiKey: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          ORG_GRADLE_PROJECT_chaufrApiBaseUrl: ${{ secrets.CHAUFR_API_BASE_URL }}
          ORG_GRADLE_PROJECT_firebaseApiKey: ${{ secrets.FIREBASE_API_KEY }}
          ORG_GRADLE_PROJECT_firebaseAppId: ${{ secrets.FIREBASE_APP_ID }}
          ORG_GRADLE_PROJECT_firebaseProjectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          ORG_GRADLE_PROJECT_firebaseSenderId: ${{ secrets.FIREBASE_SENDER_ID }}
        run: gradle :apps:passenger-android:assembleDebug :apps:driver-android:assembleDebug
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: chaufr-android-debug-apks
          path: |
            apps/passenger-android/build/outputs/apk/debug/*.apk
            apps/driver-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
