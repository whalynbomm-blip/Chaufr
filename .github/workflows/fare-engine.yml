name: Fare engine tests

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/fare-engine.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/fare-engine.yml"
  workflow_dispatch:

jobs:
  test-fare-engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chaufr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chaufr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chaufr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: services/api
        run: npm install --no-audit --no-fund
      - name: Run API unit and PostgreSQL integration tests
        working-directory: services/api
        run: npm test
      - name: Build API container image
        run: docker build -t chaufr-api:test services/api
