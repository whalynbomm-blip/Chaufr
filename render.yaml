# Free resources are for staging only. Never store real passenger/driver data here.
services:
  - type: web
    name: chaufr-api-staging
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DB_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: chaufr-staging-db
          property: connectionString
      - key: VEHICLE_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DOCUMENT_ENCRYPTION_KEY
        generateValue: true
      - key: FARE_QUOTE_SIGNING_SECRET
        generateValue: true
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      - key: FARE_CURRENCY
        value: ZAR
      - key: DAILY_ACTIVATION_FEE
        value: "30"
      - key: FARE_COMMISSION_RATE
        value: "0.12"
databases:
  - name: chaufr-staging-db
    databaseName: chaufr
    plan: free
    region: frankfurt
